<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Durga Puja Donation Drive — Lakewood Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --lake-deep:#0F3A3A; --lake-mid:#1E5F57; --moss:#7C9473;
    --walnut:#6B4226; --paper:#EEF0E6; --paper-warm:#E4E6D8;
    --brass:#C79A3D; --ink:#16211D; --ink-soft:#45564E; --error:#A6402F; --green:#3D5E33;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; }
  a{color:inherit;}
  .wrap{max-width:820px; margin:0 auto; padding:0 24px;}

  header{ background:#fff; border-bottom:1px solid rgba(22,33,29,0.1); }
  nav.wrap{ display:flex; align-items:center; justify-content:space-between; height:72px; }
  .brand{ display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink); font-family:'Fraunces',serif; font-size:18px; font-weight:600; }
  .brand-mark{ width:30px; height:30px; flex-shrink:0; object-fit:cover; border-radius:50%; display:block; }
  .back-link{ font-size:13.5px; color:var(--ink-soft); text-decoration:none; }
  .back-link:hover{ color:var(--ink); }

  main{ padding:40px 0 80px; }
  .top-row{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:16px; margin-bottom:8px; }
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:28px; margin:0 0 6px; }
  .sub{ font-size:14.5px; color:var(--ink-soft); margin:0 0 24px; line-height:1.55; max-width:560px; }

  .btn-primary{
    background:var(--walnut); color:var(--paper); border:none; border-radius:var(--radius);
    padding:12px 20px; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap;
  }
  .btn-primary:hover{ background:#5a3620; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }

  .summary-row{ display:flex; gap:1px; background:rgba(22,33,29,0.12); border:1px solid rgba(22,33,29,0.12); margin-bottom:28px; }
  .summary-box{ background:#fff; flex:1; padding:18px 20px; }
  .summary-box .num{ font-family:'Fraunces',serif; font-size:24px; font-weight:600; }
  .summary-box .lbl{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); margin-top:2px; }

  .msg{ font-size:13.5px; padding:11px 13px; border-radius:var(--radius); display:none; line-height:1.55; margin-bottom:18px; }
  .msg.error{ background:#FBEAE6; color:var(--error); display:block; }
  .msg.warning{ background:#FBF3E2; color:#8A6A1F; display:block; }
  .msg.success{ background:#E9F0E5; color:#3D5E33; display:block; }
  .msg.info{ background:var(--paper-warm); color:var(--ink-soft); display:block; }

  .panel{ background:#fff; border:1px solid rgba(22,33,29,0.1); border-radius:var(--radius); overflow:hidden; margin-bottom:20px; }
  .item-row{
    display:flex; align-items:center; gap:14px; padding:16px 20px; border-bottom:1px solid rgba(22,33,29,0.08);
  }
  .item-row:last-child{ border-bottom:none; }
  .item-row input[type=checkbox]{ width:18px; height:18px; accent-color:var(--lake-deep); flex-shrink:0; }
  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size:14.5px; font-weight:600; }
  .item-claimed-by{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .item-amount{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; white-space:nowrap; }
  .item-status{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
    padding:3px 8px; border-radius:var(--radius); white-space:nowrap;
  }
  .status-available{ background:var(--paper-warm); color:var(--green); }
  .status-taken{ background:var(--paper-warm); color:var(--ink-soft); }

  .action-bar{
    position:sticky; bottom:0; background:#fff; border:1px solid rgba(22,33,29,0.12); border-radius:var(--radius);
    padding:16px 20px; display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:24px;
  }
  .action-bar .sel-count{ font-size:13.5px; color:var(--ink-soft); }

  .empty-state, .loading-state{ text-align:center; padding:50px 0; color:var(--ink-soft); font-size:14px; }
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand">
      <img src="logo.png" alt="Lakewood Estate" class="brand-mark">
      Lakewood Estate
    </a>
    <a href="index.html" class="back-link">← Back to home</a>
  </nav>
</header>

<main class="wrap">
  <div class="top-row">
    <div>
      <h1>Durga Puja Donation Drive</h1>
      <p class="sub">Pick an item you'd like to contribute. Once claimed, it's reserved under your name so nobody duplicates it.</p>
    </div>
    <button class="btn-primary" id="downloadBtn">Download as Excel</button>
  </div>

  <div class="summary-row" id="summaryRow" style="display:none;">
    <div class="summary-box"><div class="num" id="sumClaimed">0</div><div class="lbl">Items claimed</div></div>
    <div class="summary-box"><div class="num" id="sumTotal">0</div><div class="lbl">Total items</div></div>
    <div class="summary-box"><div class="num" id="sumAmount">₹0</div><div class="lbl">Amount pledged</div></div>
  </div>

  <div class="msg" id="msgBox"></div>

  <div class="panel">
    <div id="itemsList" class="loading-state">Loading the donation list…</div>
  </div>

  <div class="action-bar" id="actionBar" style="display:none;">
    <span class="sel-count" id="selCount">0 items selected</span>
    <button class="btn-primary" id="submitBtn">Submit selection</button>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDDBDXGipe7fPs6KSElX0e4ogCO5NISaG0",
    authDomain: "lakewood-estate.firebaseapp.com",
    projectId: "lakewood-estate",
    storageBucket: "lakewood-estate.firebasestorage.app",
    messagingSenderId: "730103645174",
    appId: "1:730103645174:web:c8af4a01c36bd53df9bdd7"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const itemsList = document.getElementById('itemsList');
  const msgBox = document.getElementById('msgBox');
  const actionBar = document.getElementById('actionBar');
  const selCount = document.getElementById('selCount');
  const submitBtn = document.getElementById('submitBtn');
  const summaryRow = document.getElementById('summaryRow');

  let currentUser = null;
  let userProfile = null; // { name }
  let sheetItems = [];    // [{ itemKey, itemName, amount }]
  let claimsByKey = {};   // itemKey -> claim doc data

  function showMessage(text, type){ msgBox.textContent = text; msgBox.className = 'msg ' + type; }
  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }
  function slugify(str){
    return (str || '').toString().trim().toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || 'item';
  }

  // ---- Parse CSV (handles quoted fields with commas) ----
  function parseCSV(text){
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for(let i = 0; i < text.length; i++){
      const c = text[i], next = text[i+1];
      if(inQuotes){
        if(c === '"' && next === '"'){ field += '"'; i++; }
        else if(c === '"'){ inQuotes = false; }
        else field += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field = ''; }
        else if(c === '\n' || c === '\r'){
          if(c === '\r' && next === '\n') i++;
          row.push(field); rows.push(row); row = []; field = '';
        } else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  function sheetIdFromUrl(url){
    const m = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    return m ? m[1] : null;
  }

  async function loadSheetItems(){
    const settingsDoc = await db.collection('settings').doc('pujaDonation').get();
    if(!settingsDoc.exists || !settingsDoc.data().sheetUrl){
      throw new Error('No donation list has been configured yet. Ask the committee to set it up from the dashboard.');
    }
    const sheetUrl = settingsDoc.data().sheetUrl;
    const sheetId = sheetIdFromUrl(sheetUrl);
    if(!sheetId) throw new Error('The configured sheet link doesn\u2019t look like a valid Google Sheets URL.');

    const csvUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;
    const res = await fetch(csvUrl);
    if(!res.ok) throw new Error('Couldn\u2019t read the donation sheet. Make sure it\u2019s shared as "Anyone with the link \u2013 Viewer".');
    const text = await res.text();
    const rows = parseCSV(text);
    if(rows.length < 2) throw new Error('The donation sheet appears to be empty.');

    const header = rows[0].map(h => h.trim().toLowerCase());
    let itemCol = header.findIndex(h => h.includes('item'));
    let amountCol = header.findIndex(h => h.includes('amount') || h.includes('price') || h.includes('rate'));
    if(itemCol === -1) itemCol = 0;
    if(amountCol === -1) amountCol = 1;

    const items = [];
    const seenKeys = {};
    for(let i = 1; i < rows.length; i++){
      const r = rows[i];
      const itemName = (r[itemCol] || '').trim();
      if(!itemName) continue;
      const rawAmount = (r[amountCol] || '').replace(/[^0-9.]/g, '');
      const amount = parseFloat(rawAmount) || 0;
      let key = slugify(itemName);
      if(seenKeys[key]){ seenKeys[key]++; key = `${key}-${seenKeys[key]}`; } else { seenKeys[key] = 1; }
      items.push({ itemKey: key, itemName, amount });
    }
    return items;
  }

  async function loadClaims(){
    const snapshot = await db.collection('pujaClaims').get();
    const map = {};
    snapshot.forEach(doc => { map[doc.id] = doc.data(); });
    return map;
  }

  async function init(){
    try {
      const [items, claims] = await Promise.all([loadSheetItems(), loadClaims()]);
      sheetItems = items;
      claimsByKey = claims;
      render();
    } catch (err) {
      itemsList.innerHTML = '';
      itemsList.className = '';
      showMessage(err.message, 'error');
    }
  }

  function render(){
    const claimedCount = sheetItems.filter(it => claimsByKey[it.itemKey]).length;
    const totalAmount = sheetItems
      .filter(it => claimsByKey[it.itemKey])
      .reduce((sum, it) => sum + it.amount, 0);

    summaryRow.style.display = 'flex';
    document.getElementById('sumClaimed').textContent = claimedCount;
    document.getElementById('sumTotal').textContent = sheetItems.length;
    document.getElementById('sumAmount').textContent = '₹' + totalAmount.toLocaleString('en-IN');

    if(sheetItems.length === 0){
      itemsList.className = 'empty-state';
      itemsList.innerHTML = 'No items found in the donation list.';
      return;
    }

    itemsList.className = '';
    itemsList.innerHTML = sheetItems.map(it => {
      const claim = claimsByKey[it.itemKey];
      const disabled = !!claim || !currentUser;
      return `
        <div class="item-row">
          <input type="checkbox" data-item="${it.itemKey}" ${disabled ? 'disabled' : ''}>
          <div class="item-info">
            <div class="item-name">${escapeHtml(it.itemName)}</div>
            ${claim ? `<div class="item-claimed-by">Claimed by ${escapeHtml(claim.proposerName)}</div>` : ''}
          </div>
          <span class="item-status ${claim ? 'status-taken' : 'status-available'}">${claim ? 'Taken' : 'Available'}</span>
          <div class="item-amount">₹${it.amount.toLocaleString('en-IN')}</div>
        </div>
      `;
    }).join('');

    itemsList.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', updateSelection);
    });
    updateSelection();

    if(!currentUser){
      showMessage('Sign in to claim an item. You can still browse the list and download it below.', 'info');
    }
  }

  function updateSelection(){
    const checked = itemsList.querySelectorAll('input[type=checkbox]:checked');
    selCount.textContent = `${checked.length} item${checked.length === 1 ? '' : 's'} selected`;
    actionBar.style.display = currentUser ? 'flex' : 'none';
    submitBtn.disabled = checked.length === 0;
  }

  submitBtn.addEventListener('click', async () => {
    const checked = Array.from(itemsList.querySelectorAll('input[type=checkbox]:checked')).map(cb => cb.dataset.item);
    if(checked.length === 0) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';

    const results = await Promise.allSettled(checked.map(async (itemKey) => {
      const item = sheetItems.find(it => it.itemKey === itemKey);
      const ref = db.collection('pujaClaims').doc(itemKey);
      // Firestore rules only allow this write when the document doesn't already
      // exist (a genuine "create") — so a race with another resident fails safely here.
      await ref.set({
        itemKey,
        itemName: item.itemName,
        amount: item.amount,
        userId: currentUser.uid,
        proposerName: userProfile.name,
        claimedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }));

    const failed = results.filter(r => r.status === 'rejected').length;
    const succeeded = results.length - failed;

    claimsByKey = await loadClaims();
    render();

    if(failed === 0){
      showMessage(`You've claimed ${succeeded} item${succeeded === 1 ? '' : 's'}. Thank you!`, 'success');
    } else if(succeeded === 0){
      showMessage('Those items were just claimed by someone else. The list has been refreshed.', 'error');
    } else {
      showMessage(`Claimed ${succeeded} item${succeeded === 1 ? '' : 's'}, but ${failed} were taken by someone else moments ago. The list has been refreshed.`, 'warning');
    }

    submitBtn.textContent = 'Submit selection';
  });

  const downloadBtn = document.getElementById('downloadBtn');
  downloadBtn.addEventListener('click', () => {
    if(sheetItems.length === 0){
      showMessage('Nothing to download yet.', 'error');
      return;
    }
    const rows = sheetItems.map(it => {
      const claim = claimsByKey[it.itemKey];
      return {
        'Item': it.itemName,
        'Amount': it.amount,
        'Status': claim ? 'Claimed' : 'Available',
        'Proposer': claim ? claim.proposerName : ''
      };
    });
    const worksheet = XLSX.utils.json_to_sheet(rows);
    worksheet['!cols'] = [{ wch: 30 }, { wch: 12 }, { wch: 12 }, { wch: 24 }];
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, 'Puja Donations');
    const dateStamp = new Date().toISOString().slice(0,10);
    XLSX.writeFile(workbook, `lakewood-puja-donations-${dateStamp}.xlsx`);
  });

  auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    if(user){
      try {
        const doc = await db.collection('residents').doc(user.uid).get();
        userProfile = { name: doc.exists && doc.data().name ? doc.data().name : (user.displayName || user.email) };
      } catch (err) {
        userProfile = { name: user.displayName || user.email };
      }
    } else {
      userProfile = null;
    }
    if(sheetItems.length || Object.keys(claimsByKey).length || !itemsList.classList.contains('loading-state')){
      render();
    }
  });

  init();
</script>

</body>
</html>
