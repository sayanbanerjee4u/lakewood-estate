<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Export residents — Lakewood Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --lake-deep:#0F3A3A; --lake-mid:#1E5F57; --moss:#7C9473;
    --walnut:#6B4226; --paper:#EEF0E6; --paper-warm:#E4E6D8;
    --brass:#C79A3D; --ink:#16211D; --ink-soft:#45564E; --error:#A6402F;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; padding:32px 20px;
  }
  a{color:inherit;}
  .card{
    width:100%; max-width:460px; background:#fff; border:1px solid rgba(22,33,29,0.1);
    border-radius:var(--radius); padding:40px 34px 34px; text-align:center;
  }
  .brand{
    display:flex; align-items:center; justify-content:center; gap:9px; text-decoration:none; color:var(--ink);
    font-family:'Fraunces',serif; font-size:17px; font-weight:600; margin-bottom:28px;
  }
  .brand-mark{ width:24px; height:24px; flex-shrink:0;  object-fit:cover; border-radius:50%; display:block;}
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:24px; margin:0 0 8px; }
  .sub{ font-size:14.5px; color:var(--ink-soft); margin:0 0 26px; line-height:1.55; }
  .btn-primary{
    background:var(--walnut); color:var(--paper); border:none; border-radius:var(--radius);
    padding:13px 22px; font-weight:600; font-size:14.5px; cursor:pointer; font-family:'Inter',sans-serif;
    width:100%;
  }
  .btn-primary:hover{ background:#5a3620; }
  .btn-primary:disabled{ opacity:0.6; cursor:wait; }
  .msg{ font-size:13.5px; padding:10px 12px; border-radius:var(--radius); margin-top:16px; display:none; line-height:1.5; }
  .msg.error{ background:#FBEAE6; color:var(--error); display:block; }
  .msg.success{ background:#E9F0E5; color:#3D5E33; display:block; }
  .count{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); margin-top:14px;
  }
  .back-link{ display:block; margin-top:22px; font-size:13px; color:var(--ink-soft); text-decoration:none; }
  .back-link:hover{ color:var(--ink); }
  .signin-prompt{ display:none; }
  .signin-prompt.active{ display:block; }
  .export-panel{ display:none; }
  .export-panel.active{ display:block; }
</style>
</head>
<body>

<div class="card">
  <a href="index.html" class="brand">
    <img src="logo.png" alt="Lakewood Estate" class="brand-mark">
    Lakewood Estate
  </a>

  <div id="signinPrompt" class="signin-prompt">
    <h1>Committee access only</h1>
    <p class="sub">Sign in with a committee account to export resident records.</p>
    <a href="login.html" class="btn-primary" style="display:inline-block; text-decoration:none; box-sizing:border-box;">Go to sign in</a>
  </div>

  <div id="exportPanel" class="export-panel">
    <h1>Export residents</h1>
    <p class="sub">Downloads every registered resident's details as an Excel file.</p>
    <button class="btn-primary" id="exportBtn">Download Excel file</button>
    <div class="count" id="countText"></div>
    <div class="msg" id="msgBox"></div>
  </div>

  <a href="index.html" class="back-link">← Back to home</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDDBDXGipe7fPs6KSElX0e4ogCO5NISaG0",
    authDomain: "lakewood-estate.firebaseapp.com",
    projectId: "lakewood-estate",
    storageBucket: "lakewood-estate.firebasestorage.app",
    messagingSenderId: "730103645174",
    appId: "1:730103645174:web:c8af4a01c36bd53df9bdd7"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const signinPrompt = document.getElementById('signinPrompt');
  const exportPanel = document.getElementById('exportPanel');
  const msgBox = document.getElementById('msgBox');
  const countText = document.getElementById('countText');
  const exportBtn = document.getElementById('exportBtn');

  function showMessage(text, type){ msgBox.textContent = text; msgBox.className = 'msg ' + type; }

  auth.onAuthStateChanged((user) => {
    if(user){
      signinPrompt.classList.remove('active');
      exportPanel.classList.add('active');
    } else {
      signinPrompt.classList.add('active');
      exportPanel.classList.remove('active');
    }
  });

  exportBtn.addEventListener('click', async () => {
    exportBtn.disabled = true;
    exportBtn.textContent = 'Fetching records…';
    msgBox.className = 'msg';
    countText.textContent = '';

    try {
      const snapshot = await db.collection('residents').get();

      if(snapshot.empty){
        showMessage('No resident records found yet.', 'error');
        exportBtn.disabled = false;
        exportBtn.textContent = 'Download Excel file';
        return;
      }

      const rows = snapshot.docs.map(doc => {
        const d = doc.data();
        return {
          'Name': d.name || '',
          'Occupant Type': d.occupantType || '',
          'Email': d.email || '',
          'Mobile': d.mobile || '',
          'Tower': d.tower || '',
          'Floor': d.floor || '',
          'Flat': d.flat || '',
          'Parking Type': d.parkingType || '',
          'Parking Number': d.parkingNumber || '',
          'Vehicle Number': d.vehicleNumber || '',
          'Registered On': d.createdAt ? d.createdAt.toDate().toLocaleString() : ''
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(rows);
      worksheet['!cols'] = Object.keys(rows[0]).map(() => ({ wch: 18 }));
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Residents');

      const dateStamp = new Date().toISOString().slice(0,10);
      XLSX.writeFile(workbook, `lakewood-residents-${dateStamp}.xlsx`);

      countText.textContent = `${rows.length} resident record${rows.length === 1 ? '' : 's'} exported.`;
      showMessage('Downloaded successfully.', 'success');
    } catch (err) {
      if(err.code === 'permission-denied'){
        showMessage('Your account doesn\u2019t have export access. Ask to be added to the admin list.', 'error');
      } else {
        showMessage('Something went wrong: ' + err.message, 'error');
      }
    }

    exportBtn.disabled = false;
    exportBtn.textContent = 'Download Excel file';
  });
</script>

</body>
</html>
